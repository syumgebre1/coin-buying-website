name: Surprise Drop
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Run drop
        run: node scripts/runSurpriseDrop.mjs
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
